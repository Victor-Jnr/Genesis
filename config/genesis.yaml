# Runtime configuration. Edit this file to change behavior without a code change.
# Model switching and paths here do not require application code changes.

server:
  host: 127.0.0.1
  port: 8765

model:
  # Drop .gguf files in this directory (relative to the repo root, or an absolute path).
  directory: models
  # Pin a filename to force that model. Leave null to auto-load the only .gguf,
  # or to use the model selected through POST /model/select.
  filename: null
  context_length: 4096
  # 0 keeps inference on CPU. Set to -1 to offload every layer to the GPU.
  n_gpu_layers: 0
  temperature: 0.7
  top_p: 0.95
  max_tokens: 1024

database:
  path: storage/genesis.db

logging:
  level: INFO
  directory: storage/logs

research:
  enabled: true
  download_directory: storage/downloads
  timeout_seconds: 20
  max_bytes: 5000000
  max_results: 5
  max_actions: 8
  # Public hosts only. lab.enabled also allows private-network URLs.
  allow_private_hosts: false
  user_agent: Genesis/0.3

modules:
  directory: genesis_modules
  skills_directory: storage/skills

learning:
  max_experiments: 3

development:
  candidates_directory: storage/candidates
  test_timeout_seconds: 180

evolution:
  benchmark: tests

execution:
  # One local program per action. Off until you turn it on. This is not a shell.
  enabled: false
  timeout_seconds: 60
  max_output_chars: 8000

lab:
  # Allows private-network addresses for fetch, browse, download, and run.
  enabled: false

identity:
  name: Genesis
  system_prompt: >
    You are Genesis, a local developmental AI running on this machine.
    Answer the user directly. Use only this conversation and the current message.
